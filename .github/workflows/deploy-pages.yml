name: Deploy Sketchbook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Copy ThreeUI runtime files
        run: |
          mkdir -p public/assets public/landing-pages
          cp -R node_modules/@designcodeio/threeui/lib-dist/assets/. public/assets/
          if [ -d node_modules/@designcodeio/threeui/lib-dist/landing-pages ]; then
            cp -R node_modules/@designcodeio/threeui/lib-dist/landing-pages/. public/landing-pages/
          elif [ -d node_modules/@designcodeio/threeui/lib-dist/landing-pages ]; then
            cp -R node_modules/@designcodeio/threeui/lib-dist/landing-pages/. public/landing-pages/
          else
            echo "Landing-page runtime directory not found"
            find node_modules/@designcodeio/threeui/lib-dist -maxdepth 2 -type f | head -100
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
