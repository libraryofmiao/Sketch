name: Deploy Sketchbook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm install
          python -m pip install Pillow

      - name: Copy ThreeUI runtime files
        run: |
          mkdir -p public/assets public/landing-pages public/photo
          cp -R node_modules/@designcodeio/threeui/lib-dist/assets/. public/assets/
          if [ -d node_modules/@designcodeio/threeui/lib-dist/assets/landing-pages ]; then
            cp -R node_modules/@designcodeio/threeui/lib-dist/assets/landing-pages/. public/landing-pages/
          fi

      - name: Crop and standardize uploaded artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageOps

          source = Path("photo")
          output = Path("public/photo")
          output.mkdir(parents=True, exist_ok=True)
          for old in output.iterdir():
              if old.is_file():
                  old.unlink()

          photos = sorted(source.glob("*.png"), key=lambda p: p.name)
          if not photos:
              raise SystemExit("No PNG photos found in photo/")

          TARGET_SIZE = (1200, 850)

          for src in photos:
              image = Image.open(src).convert("RGBA")
              gray = ImageOps.grayscale(image)
              mask = gray.point(lambda p: 0 if p < 65 else 255, mode="L")

              # Remove the dark background connected to the image edges.
              for point in (
                  (0, 0),
                  (gray.width - 1, 0),
                  (0, gray.height - 1),
                  (gray.width - 1, gray.height - 1),
              ):
                  if mask.getpixel(point) == 0:
                      ImageDraw.floodfill(mask, point, 128, thresh=0)

              alpha = mask.point(lambda p: 0 if p == 128 else 255, mode="L")
              bbox = alpha.getbbox()
              if not bbox:
                  raise SystemExit(f"Could not detect artwork page in {src.name}")

              image = image.crop(bbox)
              alpha = alpha.crop(bbox)
              image.putalpha(alpha)

              # Every page gets exactly the same dimensions. The resize is anchored
              # to the artwork's center and intentionally stretches each page to the
              # same horizontal and vertical frame used by the animation.
              image = image.resize(TARGET_SIZE, Image.Resampling.LANCZOS)

              image.save(
                  output / f"{src.stem}.webp",
                  "WEBP",
                  quality=90,
                  method=6,
              )

          print(f"Processed {len(photos)} artwork pages at {TARGET_SIZE[0]}x{TARGET_SIZE[1]}")
          PY

      - name: Replace Sketchbook artwork with processed photos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path("public/landing-pages/meng-to-sketchbook.html")
          text = page.read_text(encoding="utf-8")
          photos = sorted(Path("public/photo").glob("*.webp"), key=lambda p: p.name)
          if not photos:
              raise SystemExit("No processed WebP photos found in public/photo")

          entries = ",\n".join(
              f"  {{file:'{p.name}', title:'NALC Miao · Photo {i:02d}', place:'Miao'}}"
              for i, p in enumerate(photos, 1)
          )
          replacement = "const DIR='../photo/';\nconst PAGES=[\n" + entries + "\n];"
          pattern = r"const DIR='[^']*';\s*const PAGES=\[.*?\];"
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not locate the Sketchbook PAGES definition")
          page.write_text(updated, encoding="utf-8")
          print(f"Configured {len(photos)} Sketchbook pages")
          PY

      - name: Build
        run: npm run build

      - name: Fix project-site iframe URLs
        run: |
          find dist/assets -type f -name '*.js' -print0 | xargs -0 sed -i 's#"/landing-pages/#"/Sketch/landing-pages/#g'
          find dist/assets -type f -name '*.js' -print0 | xargs -0 sed -i 's#\x27/landing-pages/#\x27/Sketch/landing-pages/#g'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
