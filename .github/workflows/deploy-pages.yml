name: Deploy Sketchbook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm install
          python -m pip install Pillow

      - name: Prepare authentic ThreeUI sketchbook
        run: |
          set -euo pipefail
          mkdir -p public/landing-pages
          cp node_modules/@designcodeio/threeui/lib-dist/assets/landing-pages/meng-to-sketchbook.html public/landing-pages/meng-to-sketchbook.html
          cp -R node_modules/@designcodeio/threeui/lib-dist/assets/sketchbook public/landing-pages/sketchbook

      - name: Optimize artwork and wire it into ThreeUI
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageOps

          source = Path("photo")
          output = Path("public/photo")
          output.mkdir(parents=True, exist_ok=True)
          for old in output.iterdir():
              if old.is_file():
                  old.unlink()

          def sort_key(p):
              return (0, int(p.stem)) if p.stem.isdigit() else (1, p.stem)

          photos = sorted(source.glob("*.png"), key=sort_key)
          if not photos:
              raise SystemExit("No PNG photos found in photo/")

          TARGET_SIZE = (1200, 850)
          saved = []

          for src in photos:
              image = Image.open(src).convert("RGBA")
              gray = ImageOps.grayscale(image)
              mask = gray.point(lambda p: 0 if p < 65 else 255, mode="L")

              for point in (
                  (0, 0),
                  (gray.width - 1, 0),
                  (0, gray.height - 1),
                  (gray.width - 1, gray.height - 1),
              ):
                  if mask.getpixel(point) == 0:
                      ImageDraw.floodfill(mask, point, 128, thresh=0)

              alpha = mask.point(lambda p: 0 if p == 128 else 255, mode="L")
              bbox = alpha.getbbox()
              if not bbox:
                  raise SystemExit(f"Could not detect artwork page in {src.name}")

              image = image.crop(bbox)
              alpha = alpha.crop(bbox)
              image.putalpha(alpha)
              image = image.resize(TARGET_SIZE, Image.Resampling.LANCZOS)

              filename = f"{src.stem}.webp"
              image.save(output / filename, "WEBP", quality=82, method=6)
              saved.append(filename)

          html_path = Path("public/landing-pages/meng-to-sketchbook.html")
          text = html_path.read_text(encoding="utf-8")

          text = re.sub(
              r"<title>.*?</title>",
              "<title>A M Tripahi</title>",
              text,
              count=1,
              flags=re.S | re.I,
          )

          text = re.sub(
              r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}",
              "admin@miaolibrary.com",
              text,
          )

          text = text.replace("A M Tripathi", "A M Tripahi")

          pages = "const PAGES=[\n" + "".join(
              f"  {{file:'{name}',title:'A M Tripahi',place:'Sketchbook'}},\n"
              for name in saved
          ) + "];"
          text, page_count = re.subn(
              r"const PAGES=\[.*?\];",
              pages,
              text,
              count=1,
              flags=re.S,
          )
          if page_count != 1:
              raise SystemExit("Could not locate ThreeUI PAGES definition")

          text, dir_count = re.subn(
              r"const DIR='[^']*';",
              "const DIR='../photo/';",
              text,
              count=1,
          )
          if dir_count != 1:
              raise SystemExit("Could not locate ThreeUI image directory")

          text, land_count = re.subn(
              r"const M=PAGES\.length, LAND=\d+;",
              "const M=PAGES.length, LAND=0;",
              text,
              count=1,
          )
          if land_count != 1:
              raise SystemExit("Could not locate ThreeUI LAND setting")

          html_path.write_text(text, encoding="utf-8")
          print(f"Wired {len(saved)} optimized artwork pages into authentic ThreeUI animation")
          PY

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
