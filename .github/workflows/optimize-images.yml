name: Optimize images

on:
  push:
    branches: [main]
    paths:
      - 'photo/**'
      - 'landing-pages/**'
      - '.github/workflows/optimize-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Generate optimized WebP and AVIF assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/optimized/photo
          shopt -s nullglob
          for f in photo/*.{png,jpg,jpeg,webp}; do
            [ -f "$f" ] || continue
            base="$(basename "${f%.*}")"
            magick "$f" -strip -resize '2400x2400>' -quality 82 "public/optimized/photo/${base}.webp"
            magick "$f" -strip -resize '2400x2400>' -quality 52 "public/optimized/photo/${base}.avif"
          done

      - name: Add responsive picture helper
        run: |
          cat > public/optimized/photo/README.txt <<'EOF'
          Generated WebP/AVIF image assets. Source images remain untouched in /photo.
          EOF

      - name: Commit optimized assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/optimized/photo
          git diff --cached --quiet || git commit -m 'chore: generate optimized WebP and AVIF images'
          git push
